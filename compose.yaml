services:
  app:
    build: .
    image: "${APP_IMAGE:-hw3-counter:local}"
    user: "10001:10001"
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8000"
    environment:
      GREETING: "${GREETING:-hello world}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      start_period: 3s
      retries: 15
    stop_grace_period: 30s

volumes:
  redis-data:
